name: Document Retrieval Hosted Evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/document-retrieval-evaluation.yml"
      - "apps/contextctl-daemon/src/cli/asset-installation.ts"
      - "apps/contextctl-daemon/src/cli/asset-directory.ts"
      - "packages/ingestion-indexing/src/infrastructure/local-embedding-asset-installation.ts"
      - "packages/ingestion-indexing/src/infrastructure/transformers-js-local-embedding-adapter.ts"
      - "packages/ingestion-indexing/test/document-retrieval-eval.test.ts"
      - "packages/ingestion-indexing/test/fixtures/document-retrieval-eval.ts"
      - "packages/ingestion-indexing/test/fixtures/document-retrieval-eval-v1/**"
      - "package-lock.json"
      - "package.json"

permissions:
  contents: read

jobs:
  document-retrieval-hosted-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: test "$(node --version)" = "v24.18.0"
      - run: test "$(npm --version)" = "11.16.0"
      - run: npm ci
      - run: npm run build
      - name: Restore pinned Granite assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/contextctl-embedding-assets
          key: granite-fp32-${{ runner.os }}-${{ hashFiles('packages/ingestion-indexing/src/infrastructure/transformers-js-local-embedding-adapter.ts') }}
      - name: Install and verify pinned Granite assets
        run: node apps/contextctl-daemon/bin/contextctl.mjs install-assets --yes --target "${RUNNER_TEMP}/contextctl-embedding-assets"
      - name: Resolve installed Granite revision
        id: granite-assets
        env:
          GRANITE_ASSET_ROOT: ${{ runner.temp }}/contextctl-embedding-assets
        run: |
          directory="$(node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { resolve } from "node:path";
            const root = process.env.GRANITE_ASSET_ROOT;
            const pointer = JSON.parse(await readFile(resolve(root, "active.json"), "utf8"));
            process.stdout.write(resolve(root, pointer.revisionDirectory));
          ')"
          test -n "${directory}"
          echo "directory=${directory}" >> "${GITHUB_OUTPUT}"
      - name: Run hosted document retrieval evaluation
        env:
          CONTEXTCTL_GRANITE_ASSET_DIRECTORY: ${{ steps.granite-assets.outputs.directory }}
          CONTEXTCTL_EVAL_RESOURCE_GATE_MODE: hosted_observation
          CONTEXTCTL_EVAL_RESULT_PATH: ${{ runner.temp }}/document-retrieval-eval.json
        run: npm run test:eval:document-retrieval
      - name: Upload hosted document retrieval result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: document-retrieval-hosted-eval-${{ github.sha }}
          path: ${{ runner.temp }}/document-retrieval-eval.json
          if-no-files-found: error
          retention-days: 30
