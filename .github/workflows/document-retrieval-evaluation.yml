name: Document Retrieval Hosted Evaluation

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  change_detection:
    name: document-retrieval-change-detection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether hosted evaluation is required
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          set +e
          git diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- \
            .github/workflows/document-retrieval-evaluation.yml \
            .nvmrc \
            package.json \
            package-lock.json \
            scripts/run-external-test.mjs \
            scripts/install-document-retrieval-eval-assets.mjs \
            scripts/run-document-retrieval-resource-probe.mjs \
            apps/contextctl-daemon/package.json \
            apps/contextctl-daemon/bin/contextctl.mjs \
            apps/contextctl-daemon/scripts/install-embedding-assets.mjs \
            apps/contextctl-daemon/src/cli/asset-directory.ts \
            apps/contextctl-daemon/src/cli/asset-installation.ts \
            packages/ingestion-indexing/package.json \
            packages/ingestion-indexing/src \
            packages/ingestion-indexing/test/document-retrieval-eval.test.ts \
            packages/ingestion-indexing/test/fixtures/document-retrieval-eval.ts \
            packages/ingestion-indexing/test/fixtures/document-retrieval-eval-v1
          status=$?
          set -e

          case "${status}" in
            0) echo "relevant=false" >> "${GITHUB_OUTPUT}" ;;
            1) echo "relevant=true" >> "${GITHUB_OUTPUT}" ;;
            *) echo "Unable to determine document retrieval changes" >&2; exit "${status}" ;;
          esac

  hosted_evaluation:
    name: document-retrieval-hosted-evaluation
    needs: change_detection
    if: ${{ needs.change_detection.outputs.relevant == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: test "$(node --version)" = "v24.18.0"
      - run: test "$(npm --version)" = "11.16.0"
      - run: npm ci
      - run: npm run build
      - name: Restore pinned Granite assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/contextctl-embedding-assets
          key: granite-fp32-${{ runner.os }}-${{ hashFiles('packages/ingestion-indexing/src/infrastructure/transformers-js-local-embedding-adapter.ts') }}
      - name: Install and verify pinned Granite assets
        run: node apps/contextctl-daemon/bin/contextctl.mjs install-assets --yes --target "${RUNNER_TEMP}/contextctl-embedding-assets"
      - name: Resolve installed Granite revision
        id: granite-assets
        env:
          GRANITE_ASSET_ROOT: ${{ runner.temp }}/contextctl-embedding-assets
        run: |
          directory="$(node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { resolve } from "node:path";
            const root = process.env.GRANITE_ASSET_ROOT;
            const pointer = JSON.parse(await readFile(resolve(root, "active.json"), "utf8"));
            process.stdout.write(resolve(root, pointer.revisionDirectory));
          ')"
          test -n "${directory}"
          echo "directory=${directory}" >> "${GITHUB_OUTPUT}"
      - name: Restore pinned Granite q4 candidate assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/contextctl-q4-eval-assets
          key: granite-q4-${{ runner.os }}-b1bc40ece1ee20ca31571f02a2143ac072ad55989da96f072b1bd958e5fa6e50
      - name: Install and verify Granite q4 candidate assets
        id: granite-q4-assets
        env:
          GRANITE_Q4_ASSET_ROOT: ${{ runner.temp }}/contextctl-q4-eval-assets
        run: |
          directory="$(node scripts/install-document-retrieval-eval-assets.mjs q4 "${GRANITE_Q4_ASSET_ROOT}")"
          test -n "${directory}"
          echo "directory=${directory}" >> "${GITHUB_OUTPUT}"
      - name: Run hosted document retrieval evaluation
        env:
          CONTEXTCTL_GRANITE_ASSET_DIRECTORY: ${{ steps.granite-assets.outputs.directory }}
          CONTEXTCTL_EVAL_RESOURCE_GATE_MODE: hosted_observation
          CONTEXTCTL_EVAL_RESULT_PATH: ${{ runner.temp }}/document-retrieval-eval.json
        run: npm run test:eval:document-retrieval
      - name: Run five isolated Granite q4 candidate observations
        env:
          CONTEXTCTL_GRANITE_ASSET_DIRECTORY: ${{ steps.granite-q4-assets.outputs.directory }}
          CONTEXTCTL_GRANITE_FP32_ASSET_DIRECTORY: ${{ steps.granite-assets.outputs.directory }}
          CONTEXTCTL_GRANITE_EVAL_PROFILE: q4
          CONTEXTCTL_EVAL_RESOURCE_GATE_MODE: hosted_observation
        run: |
          mkdir -p "${RUNNER_TEMP}/document-retrieval-q4-results"
          for attempt in 1 2 3 4 5; do
            CONTEXTCTL_EVAL_RESULT_PATH="${RUNNER_TEMP}/document-retrieval-q4-results/run-${attempt}.json" \
              npm run test:eval:document-retrieval
          done
      - name: Upload hosted document retrieval result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: document-retrieval-hosted-eval-${{ github.sha }}
          path: |
            ${{ runner.temp }}/document-retrieval-eval.json
            ${{ runner.temp }}/document-retrieval-q4-results/*.json
          if-no-files-found: error
          retention-days: 30

  required_gate:
    name: document-retrieval-gate
    needs:
      - change_detection
      - hosted_evaluation
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require evaluation when retrieval inputs changed
        env:
          CHANGE_DETECTION_RESULT: ${{ needs.change_detection.result }}
          EVALUATION_REQUIRED: ${{ needs.change_detection.outputs.relevant }}
          EVALUATION_RESULT: ${{ needs.hosted_evaluation.result }}
        run: |
          if [[ "${CHANGE_DETECTION_RESULT}" != "success" ]]; then
            echo "Document retrieval change detection did not succeed." >&2
            exit 1
          fi

          if [[ "${EVALUATION_REQUIRED}" == "true" && "${EVALUATION_RESULT}" != "success" ]]; then
            echo "Document retrieval inputs changed, but hosted evaluation did not succeed." >&2
            exit 1
          fi

          if [[ "${EVALUATION_REQUIRED}" == "false" && "${EVALUATION_RESULT}" != "skipped" ]]; then
            echo "Hosted evaluation ran unexpectedly for an unrelated change." >&2
            exit 1
          fi

          echo "Document retrieval gate passed (required=${EVALUATION_REQUIRED}, result=${EVALUATION_RESULT})."
